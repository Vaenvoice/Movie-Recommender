services:
  # Backend Service
  - type: web
    name: movie-recommender-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: PYTHONPATH=backend gunicorn -w 1 -k uvicorn.workers.UvicornWorker main:app --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        sync: false # Set this in Render Dashboard
      - key: TMDB_API_KEY
        sync: false # Set this in Render Dashboard
      - key: SECRET_KEY
        generateValue: true
      - key: PROJECT_NAME
        value: "Movie Recommender API"

  # Frontend Service (Static Site)
  - type: static
    name: movie-recommender-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: movie-recommender-backend
          property: host
